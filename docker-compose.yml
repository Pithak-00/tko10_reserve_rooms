services:
  db:
    image: postgres:16-alpine
    container_name: tko10-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}  # .env から読み込む（ハードコード禁止）
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
  django:
    build: .  # ECRイメージではなくDockerfileからビルド
    container_name: tko10-django
    ports:
      - "8080:8080"  # 80:8000 から変更
    volumes:
      - .:/workspace
    env_file:
      - .env
    working_dir: /workspace
    tty: true
    stdin_open: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
