services:
  db:
    image: postgres:16-alpine
    container_name: tko10-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
  django:
    image: ${APP_IMAGE}
    container_name: tko10-django
    ports:
      - "2222:22"
    expose:
      - "8000"
    volumes:
      - .:/workspace
    env_file:
      - .env
    working_dir: /workspace
    tty: true
    stdin_open: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: tko10-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/log/nginx/healthd:/var/log/nginx/healthd
    restart: unless-stopped
    depends_on:
      - django

volumes:
  postgres_data:
